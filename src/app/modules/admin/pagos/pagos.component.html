<div class="am-pagina am-pagina--angosta">
  <header class="am-titulos">
    <h1 class="am-h1">Generación de pagos</h1>
    <p class="am-sub">Crea un pago suelto; la persona recibe el link por correo.</p>
  </header>

  <form [formGroup]="pagoForm" class="am-tarjeta am-form" (ngSubmit)="generarPago()">
    <label class="am-campo">Correo de quien paga
      <input type="email" formControlName="var_email" autocomplete="off">
    </label>
    <label class="am-campo">Descripción del pago
      <input type="text" formControlName="var_description">
    </label>
    <div class="am-form-grid">
      <label class="am-campo">Monto (S/)
        <input #amount type="text" inputmode="decimal" formControlName="num_amount" (click)="amount.select()" (input)="calculateAmounts()">
      </label>
      <label class="am-campo">Comisión (0.1 = 10 %)
        <input type="text" inputmode="decimal" formControlName="num_commission_percentage" (input)="calculateAmounts()">
      </label>
    </div>

    <div class="resumen">
      <div><span>Comisión</span><b>S/ {{ commission | number: '1.2-2':'en-US' }}</b></div>
      <div class="resumen__total"><span>Total a cobrar</span><b>S/ {{ total | number: '1.2-2':'en-US' }}</b></div>
    </div>

    <div *ngIf="error" class="am-alerta" role="alert">
      <span class="am-icon" aria-hidden="true">error</span><span>{{ error }}</span>
    </div>

    <div class="am-acciones">
      <button type="submit" class="am-btn am-btn--primary">Generar pago</button>
    </div>
  </form>
</div>
