<div class="am-pagina">
  <header class="am-titulos">
    <h1 class="am-h1">Parámetros</h1>
    <p class="am-sub">Datos que usan los cursos de cada periodo. Los cursos en sí están en el <a routerLink="/admin/catalogo">Catálogo de cursos</a>.</p>
  </header>

  <div class="am-grid-tarjetas">
    <a *ngFor="let p of parametros" class="am-acceso" [routerLink]="p.ruta">
      <span class="am-icon am-acceso__icono" aria-hidden="true">{{ p.icono }}</span>
      <b class="am-acceso__titulo">{{ p.titulo }}</b>
      <span class="am-acceso__texto">{{ p.texto }}</span>
      <span class="am-acceso__ir">Gestionar<span class="am-icon" aria-hidden="true">chevron_right</span></span>
    </a>
  </div>
</div>
