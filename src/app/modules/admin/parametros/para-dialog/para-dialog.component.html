<div class="am dialogo">
  <header class="dialogo__cabecera">
    <h2 class="am-h2">Editar {{ nombreOrigen }}</h2>
    <button type="button" class="am-icono-boton" mat-dialog-close aria-label="Cerrar">
      <span class="am-icon" aria-hidden="true">close</span>
    </button>
  </header>

  <form class="am-form" [formGroup]="contenidoForm" (ngSubmit)="enConfirmar()">
    <label *ngFor="let campo of campos" class="am-campo">{{ etiqueta(campo) }}
      <input [formControlName]="campo">
    </label>

    <div class="dialogo__acciones">
      <button type="button" class="am-btn am-btn--secondary dialogo__boton" (click)="enCancelar()">Cancelar</button>
      <button type="submit" class="am-btn am-btn--primary dialogo__boton" [disabled]="!contenidoForm.valid">Guardar cambios</button>
    </div>
  </form>
</div>
