<div class="am dialogo">
  <header class="dialogo__cabecera">
    <h2 class="am-h2">¿Eliminar este registro?</h2>
    <button type="button" class="am-icono-boton" mat-dialog-close aria-label="Cerrar">
      <span class="am-icon" aria-hidden="true">close</span>
    </button>
  </header>

  <p class="am-sub">Se eliminará de {{ nombreOrigen }}. Esta acción no se puede deshacer.</p>

  <div class="dialogo__acciones">
    <button type="button" class="am-btn am-btn--secondary dialogo__boton" (click)="enCancelar()" [disabled]="loader">Cancelar</button>
    <button type="button" class="am-btn dialogo__boton dialogo__eliminar" (click)="enConfirmar()" [disabled]="loader">
      {{ loader ? 'Eliminando…' : 'Eliminar' }}
    </button>
  </div>
</div>
