<div class="am-pagina">
  <header class="am-titulos">
    <h1 class="am-h1">Matrícula extemporánea</h1>
    <p class="am-sub">Matricula a mano a un alumno fuera de fecha o en un curso cerrado. No genera ningún cobro.</p>
  </header>

  <form class="am-tarjeta filtros" [formGroup]="filterForm" (ngSubmit)="buscarAlumnos()">
    <div class="filtros__campos">
      <label class="am-campo">Nombre<input formControlName="nombre"></label>
      <label class="am-campo">Apellido paterno<input formControlName="apellidop"></label>
      <label class="am-campo">Apellido materno<input formControlName="apellidom"></label>
      <label class="am-campo">DNI<input formControlName="dni" inputmode="numeric"></label>
    </div>
    <button type="submit" class="am-btn am-btn--primary filtros__boton">
      <span class="am-icon" aria-hidden="true">search</span>Buscar
    </button>
  </form>

  <section class="am-tarjeta">
    <h2 class="am-h2">Usuarios</h2>
    <div *ngIf="!noResults" class="am-vacio">
      <span class="am-icon" aria-hidden="true">person_search</span>
      <span>No hay usuarios con esos datos.</span>
    </div>
    <div [hidden]="!noResults" class="am-tabla-contenedor">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let e"><b>{{ e.nombre }}</b></td>
        </ng-container>
        <ng-container matColumnDef="apellidop">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido paterno</th>
          <td mat-cell *matCellDef="let e">{{ e.apellidop }}</td>
        </ng-container>
        <ng-container matColumnDef="apellidom">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Apellido materno</th>
          <td mat-cell *matCellDef="let e">{{ e.apellidom }}</td>
        </ng-container>
        <ng-container matColumnDef="dni">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>DNI</th>
          <td mat-cell *matCellDef="let e">{{ e.dni }}</td>
        </ng-container>
        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef><span class="am-sr">Acciones</span></th>
          <td mat-cell *matCellDef="let e">
            <div class="am-fila-acciones">
              <button type="button" class="am-btn am-btn--secondary am-btn--chico" (click)="openDialogMatricula(e)">Gestionar matrícula</button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator [hidden]="!noResults" [pageSizeOptions]="[10, 20, 5]" showFirstLastButtons aria-label="Páginas de usuarios"></mat-paginator>
  </section>
</div>
