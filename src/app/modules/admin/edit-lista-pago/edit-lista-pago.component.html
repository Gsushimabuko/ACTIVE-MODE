<div class="am-pagina">
  <div *ngIf="isLoading" class="am-cargando" role="status">
    <span class="am-spinner" aria-hidden="true"></span><span class="am-sr">Cargando</span>
  </div>

  <a class="am-volver" routerLink="/admin/colectas"><span class="am-icon" aria-hidden="true">arrow_back</span>Colectas</a>

  <header class="am-titulos">
    <h1 class="am-h1">Listas de pago</h1>
    <p class="am-sub">Elige una lista para abrir su detalle, corregir montos o estados y descargar su Excel.</p>
  </header>

  <div *ngIf="errorMessage" class="am-alerta" role="alert">
    <span class="am-icon" aria-hidden="true">error</span><span>{{ errorMessage }}</span>
  </div>

  <div class="listas-scroll am-tabla-contenedor">
    <table class="am-tabla">
      <thead>
        <tr><th scope="col">Lista</th><th scope="col">Creada</th><th scope="col"><span class="am-sr">Acciones</span></th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let lista of listasPagina">
          <td><b>{{ lista.var_name }}</b></td>
          <td>{{ lista.tsp_fec_creacion | date: 'dd/MM/yyyy' }}</td>
          <td><div class="am-fila-acciones"><button type="button" class="am-btn am-btn--secondary am-btn--chico" (click)="seleccionarLista(lista)">Ver detalle</button></div></td>
        </tr>
        <tr *ngIf="!listasDePago.length && !isLoading"><td colspan="3" class="sin-datos">Todavía no hay listas de pago.</td></tr>
      </tbody>
    </table>
  </div>

  <nav *ngIf="totalPaginas > 1" class="paginacion" aria-label="Páginas de listas de pago">
    <button type="button" class="paginacion__boton" [disabled]="pagina === 1" (click)="irAPagina(pagina - 1)" aria-label="Página anterior"><span class="am-icon" aria-hidden="true">chevron_left</span></button>
    <button *ngFor="let numero of paginas" type="button" class="paginacion__boton" [class.paginacion__boton--actual]="numero === pagina"
      [attr.aria-current]="numero === pagina ? 'page' : null" (click)="irAPagina(numero)" [attr.aria-label]="'Página ' + numero">{{ numero }}</button>
    <button type="button" class="paginacion__boton" [disabled]="pagina === totalPaginas" (click)="irAPagina(pagina + 1)" aria-label="Página siguiente"><span class="am-icon" aria-hidden="true">chevron_right</span></button>
  </nav>
</div>
