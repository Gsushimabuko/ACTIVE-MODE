<section class="cal" [attr.aria-label]="'Calendario de ' + (mesCalendario | date: 'MMMM y')">
  <h2 class="cal__titulo">{{ mesCalendario | date: 'MMMM y' | titlecase }}</h2>

  <div class="cal__mes" aria-hidden="true">
    <span *ngFor="let d of diasSemana" class="cal__dia-semana">{{ d }}</span>
    <div *ngFor="let c of celdas" class="cal__celda" [class.cal__celda--vacia]="!c">
      <ng-container *ngIf="c">
        <span class="cal__num" [class.cal__num--hoy]="c.hoy">{{ c.dia }}</span>
        <span *ngFor="let ev of c.cursos" class="cal__evento" [style.border-left-color]="ev.color">
          <span class="cal__punto" [style.background]="ev.color"></span>
          <span class="cal__evento-nombre">{{ ev.nombre | titlecase }}</span>
        </span>
      </ng-container>
    </div>
  </div>

  <div *ngIf="listaCursosModificados.length; else sinClases" class="cal__leyenda">
    <h3 class="cal__leyenda-titulo">Cursos del mes</h3>
    <ul>
      <li *ngFor="let curso of listaCursosModificados">
        <span class="cal__punto" [style.background]="curso.color" aria-hidden="true"></span>
        <span><b>{{ curso.nombre | titlecase }}</b> · {{ curso.horario }} · {{ curso.eventos.length }} clases</span>
      </li>
    </ul>
  </div>
  <ng-template #sinClases>
    <p class="cal__vacio">Aún no hay clases en este mes.</p>
  </ng-template>
</section>
