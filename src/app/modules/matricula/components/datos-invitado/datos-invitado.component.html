<ng-container [formGroup]="form">
  <!-- Va junto al Periodo: los dos definen qué cursos y qué tarifa se ven. -->
  <label *ngIf="parte === 'relacion'" class="am-campo" [class.am-campo--invalido]="invalido('relacion')">Relación con el colegio
    <span class="am-campo__control">
      <select formControlName="relacion" (change)="relacionCambio.emit(form.value.relacion)">
        <option value="" disabled>Selecciona</option>
        <option *ngFor="let r of relaciones" [value]="r">{{ r }}</option>
      </select>
      <span class="am-icon am-campo__flecha" aria-hidden="true">expand_more</span>
    </span>
    <span *ngIf="invalido('relacion'); else ayudaRelacion" class="am-campo__error">Selecciona una opción.</span>
    <ng-template #ayudaRelacion><span class="ayuda">De esto depende la tarifa.</span></ng-template>
  </label>

  <ng-container *ngIf="parte === 'datos'">
    <div class="grupo">
      <h3 class="grupo__titulo">Datos del alumno</h3>
      <div class="am-form-grid">
        <label class="am-campo" [class.am-campo--invalido]="invalido('nombre')">Nombres
          <input formControlName="nombre" autocomplete="given-name">
          <span *ngIf="invalido('nombre')" class="am-campo__error">Ingresa sus nombres.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('apellidop')">Apellido paterno
          <input formControlName="apellidop" autocomplete="family-name">
          <span *ngIf="invalido('apellidop')" class="am-campo__error">Ingresa su apellido paterno.</span>
        </label>
        <label class="am-campo">
          <span>Apellido materno <span class="am-campo__opcional">(opcional)</span></span>
          <input formControlName="apellidom">
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('dni') || dniConCuenta">DNI
          <input formControlName="dni" inputmode="numeric" maxlength="8">
          <span *ngIf="verificandoDni" class="ayuda" aria-live="polite">Verificando DNI…</span>
          <span *ngIf="invalido('dni') && !dniConCuenta" class="am-campo__error">Ingresa 8 dígitos numéricos.</span>
        </label>
      </div>
      <div *ngIf="dniConCuenta" class="am-alerta aviso-dni" role="alert">
        <span class="am-icon" aria-hidden="true">person</span>
        <div class="aviso-dni__texto">
          <span>{{ dniConCuenta.mensaje || 'Este DNI ya tiene una cuenta registrada. Inicia sesión para matricularlo.' }}</span>
          <a class="am-btn am-btn--primary aviso-dni__boton" routerLink="/login" [queryParams]="{ volver: volverTrasLogin }">Iniciar sesión</a>
        </div>
      </div>
    </div>

    <div class="grupo">
      <h3 class="grupo__titulo">Contacto</h3>
      <div class="am-form-grid">
        <label class="am-campo" [class.am-campo--invalido]="invalido('correo')">Correo para el comprobante
          <input type="email" formControlName="correo" autocomplete="email">
          <span *ngIf="invalido('correo')" class="am-campo__error">Ingresa un correo válido.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('telefono')">Celular
          <input formControlName="telefono" inputmode="numeric" maxlength="9" autocomplete="tel">
          <span *ngIf="invalido('telefono')" class="am-campo__error">Ingresa 9 dígitos numéricos.</span>
        </label>
      </div>
    </div>
  </ng-container>
</ng-container>
