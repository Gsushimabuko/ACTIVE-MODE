<div class="am-pagina bloqueo">
  <span class="am-icon bloqueo__icono" aria-hidden="true">{{ seccion.icono }}</span>
  <div class="bloqueo__titulos">
    <h1 class="am-h1">{{ seccion.titulo }}</h1>
    <p class="am-sub">{{ seccion.texto }}</p>
  </div>

  <ul class="bloqueo__beneficios">
    <li *ngFor="let b of beneficios">
      <span class="am-icon" aria-hidden="true">{{ b.icono }}</span>{{ b.texto }}
    </li>
  </ul>

  <div class="bloqueo__acciones">
    <a class="am-btn am-btn--secondary bloqueo__boton" routerLink="/login">Iniciar sesión</a>
    <a class="am-btn am-btn--primary bloqueo__boton" routerLink="/login/registro">Crear cuenta</a>
  </div>
  <a class="bloqueo__seguir" routerLink="/matricula/dashboard">Seguir como invitado</a>
</div>
