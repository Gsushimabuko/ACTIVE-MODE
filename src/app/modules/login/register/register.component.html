<app-auth-layout accionTexto="Iniciar sesión" accionRuta="/login">
  <div class="am-form registro">
    <header class="am-titulos">
      <h1 class="am-h1">Crea tu cuenta</h1>
      <p class="am-sub">Inscribe a tu familia en los talleres del colegio en minutos.</p>
    </header>

    <form class="am-form" [formGroup]="registerForm" (ngSubmit)="checkForm()" novalidate>
      <div *ngIf="mensajeError" class="am-alerta" role="alert">
        <span class="am-icon" aria-hidden="true">error</span>
        <span>{{ mensajeError }}</span>
      </div>

      <label class="am-campo" [class.am-campo--invalido]="invalido('nombre')">Nombres
        <input formControlName="nombre" autocomplete="given-name">
        <span *ngIf="invalido('nombre')" class="am-campo__error">Ingresa tus nombres.</span>
      </label>

      <div class="am-form-grid registro__par">
        <label class="am-campo" [class.am-campo--invalido]="invalido('apellidop')">Apellido paterno
          <input formControlName="apellidop" autocomplete="family-name">
          <span *ngIf="invalido('apellidop')" class="am-campo__error">Ingresa tu apellido paterno.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('apellidom')">Apellido materno
          <input formControlName="apellidom">
          <span *ngIf="invalido('apellidom')" class="am-campo__error">Ingresa tu apellido materno.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('dni')">DNI / CE
          <input formControlName="dni" inputmode="numeric" maxlength="12">
          <span *ngIf="invalido('dni')" class="am-campo__error">Al menos 8 caracteres.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('dob')">Fecha de nacimiento
          <input type="date" formControlName="dob" [max]="fechaMax" autocomplete="bday">
          <span *ngIf="invalido('dob')" class="am-campo__error">Ingresa tu fecha de nacimiento.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('sexo')">Sexo
          <span class="am-campo__control">
            <select formControlName="sexo">
              <option value="" disabled>Selecciona</option>
              <option *ngFor="let sexo of listaSexos" [value]="sexo">{{ sexo }}</option>
            </select>
            <span class="am-icon am-campo__flecha" aria-hidden="true">expand_more</span>
          </span>
          <span *ngIf="invalido('sexo')" class="am-campo__error">Selecciona una opción.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('telefono')">Teléfono
          <input formControlName="telefono" inputmode="tel" autocomplete="tel">
          <span *ngIf="invalido('telefono')" class="am-campo__error">Al menos 8 dígitos.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('direccion')">Dirección
          <input formControlName="direccion" autocomplete="street-address">
          <span *ngIf="invalido('direccion')" class="am-campo__error">Ingresa tu dirección.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('relacion')">Relación con el colegio
          <span class="am-campo__control">
            <select formControlName="relacion">
              <option value="" disabled>Selecciona</option>
              <option *ngFor="let relacion of listaRelaciones" [value]="relacion">{{ relacion }}</option>
            </select>
            <span class="am-icon am-campo__flecha" aria-hidden="true">expand_more</span>
          </span>
          <span *ngIf="invalido('relacion')" class="am-campo__error">Selecciona una opción.</span>
        </label>
      </div>

      <label class="am-campo" [class.am-campo--invalido]="invalido('correo')">Correo electrónico
        <input type="email" formControlName="correo" autocomplete="email">
        <span *ngIf="invalido('correo')" class="am-campo__error">Ingresa un correo válido.</span>
      </label>

      <label class="am-campo" [class.am-campo--invalido]="invalido('contrasena')">Contraseña
        <span class="am-campo__control">
          <input [type]="hide ? 'password' : 'text'" formControlName="contrasena" autocomplete="new-password" class="am-con-boton">
          <button type="button" class="am-campo__boton" (click)="hide = !hide" [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <span class="am-icon" aria-hidden="true">{{ hide ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </span>
        <span *ngIf="invalido('contrasena')" class="am-campo__error">Crea una contraseña.</span>
      </label>

      <button type="submit" class="am-btn am-btn--primary am-btn--bloque" [disabled]="enviando">
        {{ enviando ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <app-boton-invitado></app-boton-invitado>

    <p class="am-pie-form">
      <span>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></span>
      <a class="registro__olvide" routerLink="/login/recuperar">¿Olvidaste tu contraseña?</a>
    </p>
  </div>
</app-auth-layout>
