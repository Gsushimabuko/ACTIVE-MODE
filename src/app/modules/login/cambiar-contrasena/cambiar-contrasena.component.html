<app-auth-layout accionTexto="Iniciar sesión" accionRuta="/login">
  <div class="am-form cambiar">
    <ng-container *ngIf="!cambio; else listo">
      <header class="am-titulos">
        <h1 class="am-h1">Crea una nueva contraseña</h1>
        <p class="am-sub">Debe tener al menos 6 caracteres.</p>
      </header>

      <form class="am-form" [formGroup]="contrasenaForm" (ngSubmit)="cambiarContrasena()" novalidate>
        <div *ngIf="error" class="am-alerta" role="alert">
          <span class="am-icon" aria-hidden="true">error</span>
          <span>No pudimos cambiar la contraseña. El enlace puede haber vencido: pide uno nuevo.</span>
        </div>

        <label class="am-campo" [class.am-campo--invalido]="invalido('contrasena')">Nueva contraseña
          <input type="password" formControlName="contrasena" autocomplete="new-password">
          <span *ngIf="invalido('contrasena')" class="am-campo__error">Al menos 6 caracteres.</span>
        </label>
        <label class="am-campo" [class.am-campo--invalido]="invalido('contrasena2')">Confirmar contraseña
          <input type="password" formControlName="contrasena2" autocomplete="new-password">
          <span *ngIf="invalido('contrasena2')" class="am-campo__error">
            {{ contrasenaForm.controls['contrasena2'].hasError('matchError') ? 'Las contraseñas no coinciden.' : 'Confirma la contraseña.' }}
          </span>
        </label>

        <button type="submit" class="am-btn am-btn--primary am-btn--bloque">Guardar contraseña</button>
      </form>

      <a *ngIf="error" routerLink="/login/recuperar" class="cambiar__nuevo">Pedir un enlace nuevo</a>
    </ng-container>

    <ng-template #listo>
      <div class="cambiar__listo" role="status">
        <span class="am-icon cambiar__icono" aria-hidden="true">check</span>
        <h1 class="am-h1">Contraseña actualizada</h1>
        <p class="am-sub">Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <a class="am-btn am-btn--primary am-btn--bloque" routerLink="/login">Iniciar sesión</a>
      </div>
    </ng-template>
  </div>
</app-auth-layout>
