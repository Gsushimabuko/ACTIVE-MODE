<app-auth-layout accionTexto="Portal de familias" accionRuta="/">
  <div class="am-form admin-login">
    <header class="am-titulos">
      <h1 class="am-h1">Backoffice</h1>
      <p class="am-sub">Ingresa con tu cuenta de administración o de portería.</p>
    </header>

    <form class="am-form" [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
      <div *ngIf="mensaje" class="am-alerta" role="alert">
        <span class="am-icon" aria-hidden="true">error</span>
        <span>{{ mensaje }}</span>
      </div>

      <label class="am-campo" [class.am-campo--invalido]="invalido('correo')">Correo electrónico
        <input type="email" formControlName="correo" autocomplete="email">
        <span *ngIf="invalido('correo')" class="am-campo__error">Ingresa un correo válido.</span>
      </label>

      <label class="am-campo" [class.am-campo--invalido]="invalido('contrasena')">Contraseña
        <span class="am-campo__control">
          <input [type]="hide ? 'password' : 'text'" formControlName="contrasena" autocomplete="current-password" class="am-con-boton">
          <button type="button" class="am-campo__boton" (click)="hide = !hide" [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <span class="am-icon" aria-hidden="true">{{ hide ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </span>
        <span *ngIf="invalido('contrasena')" class="am-campo__error">Ingresa tu contraseña.</span>
      </label>

      <button type="submit" class="am-btn am-btn--primary am-btn--bloque" [disabled]="enviando">
        {{ enviando ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</app-auth-layout>
