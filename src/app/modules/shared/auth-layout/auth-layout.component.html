<div class="am acceso">
  <header class="acceso__barra">
    <a routerLink="/" aria-label="Active Mode, ir al inicio">
      <img class="acceso__logo" src="assets/images/active-mode-logo.png" alt="Active Mode">
    </a>
    <a *ngIf="accionTexto" class="am-btn acceso__accion" [routerLink]="accionRuta">{{ accionTexto }}</a>
  </header>

  <main class="acceso__main" [class.acceso__main--con-imagen]="conImagen">
    <section class="acceso__contenido">
      <div class="acceso__caja">
        <ng-content></ng-content>
      </div>
    </section>

    <aside *ngIf="conImagen" class="acceso__imagen" aria-hidden="true">
      <div class="acceso__imagen-texto">
        <p class="acceso__frase">Cada talento merece un espacio para crecer.</p>
        <p class="acceso__detalle">Talleres deportivos y recreativos para alumnos, exalumnos y toda la familia.</p>
      </div>
    </aside>
  </main>
</div>
